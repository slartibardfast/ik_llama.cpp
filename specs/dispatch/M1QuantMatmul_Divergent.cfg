\* TLC config for M1QuantMatmul.tla — FAMILY-SPECIFIC NEGATIVE control.
\* Mechanism = M1_DIVERGENT_MULTICOL — an M1 kernel that is CORRECT at the
\* batch-1 column (it would pass a naive M=1 byte-compare) but WRONG for a
\* column in a multi-column batch (M>=2): it violates the per-column
\* FaithfulByteIdentity / M1MustMatchMmqScaleAccumOrder only at ne11>1.
\* MaxBatch = 4 makes the M>=2 case reachable.
\*
\* ObservationalEquivalence MUST be violated reachably: a Decode at M>=2 emits
\* PerturbedToken on the test run while the baseline emits BaselineToken. This
\* is the "family contract binds" check — it catches exactly the np1 != npK
\* break that a batch-1-only contract/test would MISS. CI requires this run to
\* report 'Invariant ObservationalEquivalence is violated'.

CONSTANTS
    BaselineToken = "baseline"
    PerturbedToken = "perturbed"
    MaxStep = 5
    MaxBatch = 4
    Mechanism = "M1_DIVERGENT_MULTICOL"

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ObservationalEquivalence
    FaithfulByteIdentity
